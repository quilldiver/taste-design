name: Deploy Next.js site to GitHub Pages

on:
  # 每次推到 main 自动构建并发布（对应「以后任何修改都同步上线」）
  push:
    branches: [main]
  # 也允许在 Actions 面板手动点一次
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次发布；排队中的旧部署会被取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taste-design
    env:
      # Pages 项目站点挂在 /<仓库名> 子路径下，必须和仓库名一致。
      # 改仓库名时要同步改这里，否则资源会 404。
      NEXT_PUBLIC_BASE_PATH: /taste-design
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taste-design/package-lock.json

      - name: Install dependencies
        run: npm install

      # next build 会顺带做 TypeScript 类型检查；产物输出到 taste-design/out
      - name: Build (static export)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: taste-design/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
